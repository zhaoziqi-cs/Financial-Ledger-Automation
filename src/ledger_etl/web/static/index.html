<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资金台账自动化（本地）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header>
    <h1>资金台账自动化</h1>
    <p class="sub">上传本期银行流水 → 自动解析并入账（SQLite 主表）→ 可预览 / 下载最新台账。</p>
  </header>

  <section class="card">
    <form id="uploadForm">
      <label for="bank_flow">银行流水（Excel，必选）</label>
      <input id="bank_flow" name="bank_flow" type="file" accept=".xlsx,.xls" required>

      <label for="project_map">项目编码映射（可选，缺省用服务端 data/config/project_map.xlsx）</label>
      <input id="project_map" name="project_map" type="file" accept=".xlsx,.xls">

      <button type="submit">解析并入库</button>
    </form>
    <div id="msg" class="msg" hidden></div>
  </section>

  <section id="result" hidden>
    <div id="stats" class="stats"></div>

    <div class="tools">
      <a id="dlLedger" class="btn" href="/downloads/ledger.xlsx">⬇ 下载最新台账 ledger.xlsx</a>
      <a id="dlAudit" class="btn alt" href="/downloads/audit.xlsx">⬇ 未识别清单</a>
    </div>

    <h2>主表尾部预览</h2>
    <div class="scroll">
      <table id="preview">
        <thead><tr><th>日期</th><th>项目</th><th>摘要</th><th>收</th><th>支</th><th>余额</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <p id="unmatched" class="muted"></p>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => (n == null ? "" : Number(n).toLocaleString("zh-CN", {minimumFractionDigits: 2, maximumFractionDigits: 2}));

$("uploadForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("msg");
  msg.hidden = true;
  const form = new FormData($("uploadForm"));
  const btn = $("uploadForm").querySelector("button");
  btn.disabled = true; btn.textContent = "处理中…";
  try {
    const r = await fetch("/api/run", {method: "POST", body: form});
    const data = await r.json();
    if (!r.ok) { showMsg("处理失败：" + (data.detail || "未知错误"), true); return; }
    render(data);
  } catch (err) {
    showMsg("请求出错：" + err, true);
  } finally {
    btn.disabled = false; btn.textContent = "解析并入库";
  }
});

function showMsg(text, isError) {
  const m = $("msg");
  m.textContent = text;
  m.hidden = false;
  m.className = "msg " + (isError ? "err" : "ok");
}

function render(d) {
  const m = d.merged;
  $("stats").innerHTML =
    `<div class="stat"><b>${d.agg_rows}</b><span>聚合写入 ${d.raw_rows} 原始行</span></div>` +
    `<div class="stat"><b>${m.appended}</b><span>本期并入 ${m.ledger_rows} 行主表</span></div>` +
    `<div class="stat"><b>${fmt(m.latest_balance)}</b><span>最新余额</span></div>` +
    `<div class="stat"><b>${d.unmatched.pending}</b><span>未识别待处理</span></div>`;

  const tb = $("preview").querySelector("tbody");
  tb.innerHTML = d.preview.map(r =>
    `<tr><td>${r.date}</td><td>${r.project}</td><td>${r.summary}</td>` +
    `<td class="num">${r.income ? fmt(r.income) : ""}</td>` +
    `<td class="num">${r.expense ? fmt(r.expense) : ""}</td>` +
    `<td class="num">${fmt(r.balance)}</td></tr>`).join("");

  $("unmatched").textContent = d.unmatched.pending
    ? `本次有 ${d.unmatched.inserted} 条新未识别记录（累计待处理 ${d.unmatched.pending}）。下载「未识别清单」核对后补映射，再运行 recheck 修正。`
    : "";
  $("result").hidden = false;
  $("result").scrollIntoView({behavior: "smooth"});
}
</script>
</body>
</html>
