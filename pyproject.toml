[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-etl"
version = "0.1.0"
description = "资金台账自动化：银行流水 Excel 解析 → SQLite 入库并账（本地 FastAPI 网页端）"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlsxwriter>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
ledger = "ledger_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ledger_etl*"]

[tool.setuptools.package-data]
"ledger_etl.web" = ["static/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
